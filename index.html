<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakso Mamina</title>
<style>
:root{--bg:#121212;--card:#1f1f1f;--text:#fff;--muted:#bdbdbd;--accent:#ff3b30;--green:#25D366;--danger:#ff3b30}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px;text-align:center;background:linear-gradient(135deg,#4a0404,#8b0000);position:sticky;top:0;z-index:10}
header img{width:82px;height:82px;border-radius:50%;border:3px solid #fff;object-fit:cover}
.brand-title{margin:8px 0 2px;display:inline-block;animation:gerakMamina 2.4s ease-in-out infinite}
@keyframes gerakMamina{
  0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
  25%{transform:translateY(-3px) rotate(-1.5deg) scale(1.02)}
  50%{transform:translateY(0) rotate(0deg) scale(1.04)}
  75%{transform:translateY(-2px) rotate(1.5deg) scale(1.02)}
}
.wrap{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--card);padding:14px;border-radius:18px;min-width:0}.price{color:#ffd27d;font-weight:bold}.small{color:var(--muted);font-size:13px}
.btn{border:none;background:var(--green);color:#fff;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:bold}.btn2{background:var(--accent)}
.btn-add{margin-top:8px;width:100%;padding:7px 10px;font-size:12px;border-radius:10px;background:#2b8a3e;color:#fff;border:none;cursor:pointer;font-weight:bold}
.qty{display:flex;gap:6px;align-items:center;margin-top:10px;flex-shrink:0}.qty button{width:32px;height:32px;border:none;border-radius:10px;background:#333;color:#fff;font-size:18px;cursor:pointer}
.qty-input{width:46px !important;padding:6px 4px !important;margin:0 !important;text-align:center;font-weight:bold;border-radius:8px !important;background:#2a2a2a;color:#fff}
.topbar{position:sticky;top:118px;background:#000;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:9}
.promo-track{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.promo-text{display:inline-block;padding-right:20px;animation:jalanKananKeKiri 12s linear infinite}
@keyframes jalanKananKeKiri{
  0%{transform:translateX(100%)}
  100%{transform:translateX(-100%)}
}
.section{font-size:24px;margin:18px 0 10px}
input{width:100%;padding:12px;border:none;border-radius:12px;background:#2a2a2a;color:#fff;margin-bottom:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.badge{position:absolute;top:-8px;right:-10px;background:var(--danger);padding:2px 7px;border-radius:50%;font-size:12px}
#cartPanel{position:fixed;top:0;right:-380px;width:340px;height:100%;background:#111;z-index:99;padding:18px;transition:.20s;overflow:auto;box-shadow:-8px 0 20px rgba(0,0,0,.4)}
.opsi-box{margin-top:8px;padding-top:8px;border-top:1px solid #333;font-size:11px;min-width:0}
.isi-list{display:flex;flex-direction:row;gap:5px;margin-top:4px}
.toping-row{display:flex;flex-wrap:row;align-items:center;gap:6px 10px;margin-top:4px;max-width:100%}
.opsi-label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;margin:0;line-height:1.25;max-width:100%}
.opsi-label input{width:auto !important;margin:0 !important;padding:0 !important;flex-shrink:0}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #262626}
.cart-mini-btn{border:none;background:#333;color:#fff;border-radius:6px;padding:2px 7px;cursor:pointer;font-weight:bold}
.checkout-total{margin-top:12px;padding-top:10px;border-top:1px solid #333;font-size:15px;font-weight:bold;color:#ffd27d;display:flex;justify-content:space-between;align-items:center}
.checkout-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (prefers-reduced-motion: reduce){
  .brand-title,.promo-text{animation:none}
}
</style>
</head>
<body>
<header><img src="WhatsApp Image 2026-02-05 at 02.14.50.jpeg"><br><h1 class="brand-title">🍜 Bakso Mamina</h1><div>Mamina Style • Dark Premium</div></header>
<div id="cartPanel"><h2>🛒 Keranjang</h2><div id="popupCart"></div><div class="checkout-total"><span>Total:</span><span>Rp<span id="popupTotal">0</span></span></div><button class="btn" style="margin-top:12px" onclick="toggleCart()">Tutup</button></div>
<div class="topbar">
  <div class="promo-track"><span class="promo-text">🎉 Sate Marangi Hanya 15.000 / 10 Tusuk,-</span></div>
  <div onclick="toggleCart()" style="cursor:pointer;position:relative;flex-shrink:0">🛒 <span class="badge" id="badgeCart">0</span> <span id="jumlahItem">0</span> | Rp<span id="grandTotal">0</span></div>
</div>
<div class="wrap">
<input id="searchMenu" placeholder="🔍 Cari menu..." onkeyup="filterMenu()">
<div class="tabs"><button class="btn" onclick="filterKategori('all')">Semua</button><button class="btn" onclick="filterKategori('bakso')">Bakso</button><button class="btn" onclick="filterKategori('mie')">Mie</button><button class="btn" onclick="filterKategori('dimsum')">Dimsum</button><button class="btn" onclick="filterKategori('sate')">Sate</button><button class="btn" onclick="filterKategori('minum')">Minuman</button></div>
<h2 class="section">Daftar Menu</h2>
<div class="grid" id="menuGrid"></div>
<h2 class="section">Checkout</h2>
<div class="card">
  <input id="meja" placeholder="Nomor meja / nama customer">
  <div id="listCart" class="small" style="margin-top:6px"></div>
  <div class="checkout-total">
    <span>Total Harga:</span>
    <span>Rp<span id="checkoutTotal">0</span></span>
  </div>
  <div class="checkout-actions">
    <button class="btn" onclick="kirimSheet()">📊 Kirim Order</button>
    <button class="btn btn2" onclick="checkoutWA()">💬 Kirim WA</button>
  </div>
</div>
</div>

<script>
const SHEET_URL='https://script.google.com/macros/s/AKfycbyTS8x0KKybnZ-dujz1hsVi1tQq32iQQOSCEi0iOufI-s18ubEJDPEaO6954pq8ogVrVw/exec';
let cart=[];
let pilihanSementara={}; // { [namaMenu]: { isi: [], toping: [] } }
let jumlahSementara={};  // { [namaMenu]: number }
let cartAutoCloseTimer = null;

const menu=[
['Bakso Daging',10000,'bakso'],['Bakso Urat',15000,'bakso'],['Bakso Mercon',15000,'bakso'],['Bakso Keju',15000,'bakso'],['Bakso Telur',15000,'bakso'],['Bakso Daging Jumbo',20000,'bakso'],
['Mie Ayam',10000,'mie'],['Mie Ayam Tulang',15000,'mie'],['Mie Ayam Bakso Kecil',13000,'mie'],['Mie Ayam Bakso Daging',18000,'mie'],['Mie Ayam Bakso Urat Dll',24000,'mie'],['Mie Ayam Bakso Jumbo',29000,'mie'],
['Dimsum Ori isi 3',10000,'dimsum'],['Dimsum Ori isi 6',20000,'dimsum'],['Dimsum Mentai isi 3',12000,'dimsum'],['Dimsum Mentai isi 6',23000,'dimsum'],
['Es Jeruk',5000,'minum'],['Es Teh Manis',4000,'minum'],['Es Nutrisari',4000,'minum'],['Tea Jus',2000,'minum'],
['Sate Marangi',15000,'sate'],['Nasi',5000,'sate']];

const menuBaksoChecklist = [
  'Bakso Daging',
  'Bakso Urat',
  'Bakso Mercon',
  'Bakso Keju',
  'Bakso Telur',
  'Bakso Daging Jumbo',
];

const opsiIsi = ['Bihun', 'Mie', 'Toge', 'Sawi'];
const opsiToping = [
  { nama: 'Tetelan', harga: 7000 },
  { nama: 'Kikil', harga: 3000 },
  { nama: 'Tahu', harga: 1000 }
];

let activeList = menu;

function rupiah(n){return n.toLocaleString('id-ID')}

function getStateOpsi(namaMenu){
  if(!pilihanSementara[namaMenu]){
    pilihanSementara[namaMenu] = { isi: [], toping: [] };
  }
  return pilihanSementara[namaMenu];
}

function hitungHargaToping(topingArr=[]){
  return topingArr.reduce((sum, namaToping) => {
    const found = opsiToping.find(t => t.nama === namaToping);
    return sum + (found ? found.harga : 0);
  }, 0);
}

function buatVarianKey(namaMenu, isiArr=[], topingArr=[]){
  const isiKey = [...isiArr].sort().join(',');
  const topingKey = [...topingArr].sort().join(',');
  return `${namaMenu}||isi:${isiKey}||toping:${topingKey}`;
}

function ubahIsi(namaMenu, isi, isChecked){
  const state = getStateOpsi(namaMenu);
  if(isChecked){
    if(!state.isi.includes(isi)) state.isi.push(isi);
  } else {
    state.isi = state.isi.filter(x => x !== isi);
  }
}

function ubahToping(namaMenu, namaToping, isChecked){
  const state = getStateOpsi(namaMenu);
  if(isChecked){
    if(!state.toping.includes(namaToping)) state.toping.push(namaToping);
  } else {
    state.toping = state.toping.filter(x => x !== namaToping);
  }
}

function masukkanVarianKeCart(namaMenu, hargaDasar, qtyOverride=null){
  const state = getStateOpsi(namaMenu);
  const inputQty = qtyOverride !== null ? qtyOverride : (jumlahSementara[namaMenu] || 1);
  const qty = Math.max(1, parseInt(inputQty, 10) || 1);
  const hargaSatuan = hargaDasar + hitungHargaToping(state.toping);
  const key = buatVarianKey(namaMenu, state.isi, state.toping);

  const idx = cart.findIndex(x => x.key === key);
  if(idx !== -1){
    cart[idx].qty += qty;
  } else {
    cart.push({
      key: key,
      namaDasar: namaMenu,
      nama: namaMenu,
      harga: hargaSatuan,
      qty: qty,
      isi: [...state.isi],
      toping: [...state.toping]
    });
  }

  jumlahSementara[namaMenu] = 0;
  render();
  animasi();
  toggleOpen(2500);
}

function setJumlahLangsung(namaMenu, hargaDasar, nilaiBaru){
  const qty = Math.max(0, parseInt(nilaiBaru, 10) || 0);
  jumlahSementara[namaMenu] = qty;
  if(qty > 0){
    masukkanVarianKeCart(namaMenu, hargaDasar, qty);
  }
}

function tambah(namaMenu, hargaDasar){
  masukkanVarianKeCart(namaMenu, hargaDasar, 1);
}

function kurang(namaMenu){
  for(let i = cart.length - 1; i >= 0; i--){
    if(cart[i].namaDasar === namaMenu){
      ubahQtyCart(i, -1);
      return;
    }
  }
}

function ubahQtyCart(index, delta){
  if(!cart[index]) return;
  cart[index].qty += delta;
  if(cart[index].qty <= 0){
    cart.splice(index, 1);
  }
  render();
}

function buildMenu(arr=activeList){
  activeList = arr;
  const grid = document.getElementById('menuGrid');
  if(!grid) return;

  let html='';
  arr.forEach(m=>{
    const namaMenu = m[0];
    const hargaDasar = m[1];
    const tampilChecklist = menuBaksoChecklist.includes(namaMenu);
    const state = getStateOpsi(namaMenu);
    const qtyInput = jumlahSementara[namaMenu] || 0;

    html += `
    <div class='card item ${m[2]}'>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-width:0;">
        <div style="flex:1;min-width:0;">
          <h3 style="margin:0 0 4px">${namaMenu}</h3>
          <div class='price'>Rp${rupiah(hargaDasar)}</div>

          ${tampilChecklist ? `
          <div class="opsi-box">
            <div style="color:#aaa;">Pilihan Isi</div>
            <div class="isi-list">
              ${opsiIsi.map(isi => `
                <label class="opsi-label">
                  <input type="checkbox"
                    ${state.isi.includes(isi) ? 'checked' : ''}
                    onchange="ubahIsi('${namaMenu}', '${isi}', this.checked)"> ${isi}
                </label>
              `).join('')}
            </div>

            <div style="color:#ffd27d;margin-top:8px;">Toping (Opsional)</div>
            <div class="toping-row">
              ${opsiToping.map(t => `
                <label class="opsi-label">
                  <input type="checkbox"
                    ${state.toping.includes(t.nama) ? 'checked' : ''}
                    onchange="ubahToping('${namaMenu}', '${t.nama}', this.checked)"> ${t.nama} (+${rupiah(t.harga)})
                </label>
              `).join('')}
            </div>

            <button class="btn-add" onclick="masukkanVarianKeCart('${namaMenu}', ${hargaDasar})">+ Masukkan Varian</button>
          </div>` : ''}
        </div>

        <div class="qty" style="margin-top:0;">
          <button onclick="kurang('${namaMenu}')">−</button>
          <input type="number" min="0" class="qty-input" value="${qtyInput}"
            onchange="setJumlahLangsung('${namaMenu}', ${hargaDasar}, this.value)">
          <button onclick="tambah('${namaMenu}', ${hargaDasar})">+</button>
        </div>
      </div>
    </div>`;
  });

  grid.innerHTML = html;
}

function formatDetailItem(item){
  const parts = [];
  if(item.isi && item.isi.length > 0) parts.push(`Isi: ${item.isi.join(', ')}`);
  if(item.toping && item.toping.length > 0) parts.push(`Toping: ${item.toping.join(', ')}`);
  else if(menuBaksoChecklist.includes(item.namaDasar)) parts.push('Tanpa toping');
  return parts.length > 0 ? ` <span style="color:#ffd27d">[${parts.join(' | ')}]</span>` : '';
}

function render(rebuild=true){
  let total=0, qty=0, html='';
  cart.forEach((i, idx)=>{
    qty+=i.qty;
    total+=i.qty*i.harga;
    html+=`
      <div class="cart-row">
        <div>${i.nama}${formatDetailItem(i)} x${i.qty} - Rp${rupiah(i.qty*i.harga)}</div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="cart-mini-btn" onclick="ubahQtyCart(${idx}, -1)">−</button>
          <button class="cart-mini-btn" onclick="ubahQtyCart(${idx}, 1)">+</button>
        </div>
      </div>`;
  });

  const totalFormatted = rupiah(total);
  document.getElementById('jumlahItem').innerText=qty;
  document.getElementById('badgeCart').innerText=qty;
  document.getElementById('grandTotal').innerText=totalFormatted;
  document.getElementById('checkoutTotal').innerText=totalFormatted;
  document.getElementById('popupTotal').innerText=totalFormatted;
  document.getElementById('listCart').innerHTML=html||'Keranjang kosong';
  document.getElementById('popupCart').innerHTML=html||'Keranjang kosong';
  if(rebuild) buildMenu(activeList);
}

function clearCartAutoCloseTimer(){
  if(cartAutoCloseTimer){
    clearTimeout(cartAutoCloseTimer);
    cartAutoCloseTimer = null;
  }
}

function toggleCart(){
  let p=document.getElementById('cartPanel');
  const sedangTerbuka = p.style.right === '0px';
  clearCartAutoCloseTimer();
  p.style.right = sedangTerbuka ? '-380px' : '0px';
}

function toggleOpen(autoCloseMs = 2500){
  let p=document.getElementById('cartPanel');
  p.style.right='0px';
  p.scrollTo({top:0,behavior:'smooth'});
  clearCartAutoCloseTimer();
  if(autoCloseMs > 0){
    cartAutoCloseTimer = setTimeout(() => {
      p.style.right = '-380px';
    }, autoCloseMs);
  }
}

function animasi(){
  document.getElementById('badgeCart').animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:300});
}

function checkoutWA(){
  if(cart.length === 0){
    alert('Keranjang masih kosong! Masukkan jumlah atau klik + Masukkan Varian terlebih dahulu.');
    return;
  }
  let meja=document.getElementById('meja').value||'-';
  let txt='Halo, saya pesan%0A';
  cart.forEach(i=>{
    const catatan = [];
    if(i.isi && i.isi.length > 0) catatan.push('Isi: ' + i.isi.join(', '));
    if(i.toping && i.toping.length > 0) catatan.push('Toping: ' + i.toping.join(', '));
    else if(menuBaksoChecklist.includes(i.namaDasar)) catatan.push('Tanpa toping');
    const info = catatan.length > 0 ? ` [${catatan.join(' | ')}]` : '';
    txt += `${i.nama}${info} x${i.qty} = Rp${rupiah(i.qty*i.harga)}%0A`;
  });
  txt+='Meja/Nama: '+meja+'%0ATotal: Rp'+document.getElementById('checkoutTotal').innerText;
  window.open('https://wa.me/6285691916995?text='+txt,'_blank');
}

function kirimSheet(){
  if(cart.length === 0){
    alert('Keranjang masih kosong! Masukkan jumlah atau klik + Masukkan Varian terlebih dahulu.');
    return;
  }
  let meja=document.getElementById('meja').value||'-';
  let cartPayload = cart.map(i => {
    const catatan = [];
    if(i.isi && i.isi.length > 0) catatan.push('Isi: ' + i.isi.join(', '));
    if(i.toping && i.toping.length > 0) catatan.push('Toping: ' + i.toping.join(', '));
    else if(menuBaksoChecklist.includes(i.namaDasar)) catatan.push('Tanpa toping');
    return {
      nama: catatan.length > 0 ? `${i.nama} [${catatan.join(' | ')}]` : i.nama,
      isi: i.isi || [],
      toping: i.toping || [],
      harga: i.harga,
      qty: i.qty
    };
  });

  fetch(SHEET_URL,{
    method:'POST',
    body:JSON.stringify({meja, cart: cartPayload, total:document.getElementById('checkoutTotal').innerText})
  }).then(()=>alert('Pesanan masuk Google Sheets'));
}

function filterMenu(){
  let q=document.getElementById('searchMenu').value.toLowerCase();
  buildMenu(menu.filter(m=>m[0].toLowerCase().includes(q)));
}
function filterKategori(k){
  document.getElementById('searchMenu').value='';
  if(k==='all'){buildMenu(menu);return;}
  buildMenu(menu.filter(m=>m[2]===k));
}

buildMenu();
render();
</script>
</body>
</html>
